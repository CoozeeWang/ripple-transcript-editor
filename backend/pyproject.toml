[project]
name = "ripple-backend"
version = "0.1.0"
description = "Local backend for Ripple"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.35.0",
    "websockets>=12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
