[package]
name = "ripple-desktop"
version = "0.2.0-beta.1"
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSImage", "NSWorkspace", "NSPrintInfo", "NSPrintOperation", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", features = ["NSURL", "NSData", "NSString", "NSArray", "NSError"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
webview2-com = "0.38.2"
windows-core = "0.61"
