[package]
name = "ripple-desktop"
version = "0.2.0-beta.1"
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]
segment-transfer-test = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
url = "2"
semver = "1"
tokio = { version = "1", features = ["time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["block2", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSPasteboardItem", "NSApplication", "NSEvent", "NSView", "NSPasteboard", "NSImage", "NSWorkspace", "NSPrintInfo", "NSPrintOperation", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", features = ["NSURL", "NSData", "NSString", "NSArray", "NSError"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "=2.4.4"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_Networking_WinHttp"] }
webview2-com = "0.38.2"
windows-core = "0.61"
